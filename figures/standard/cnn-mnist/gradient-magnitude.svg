<svg xmlns="http://www.w3.org/2000/svg" width="328" height="242" viewBox="0 0 328 242" font-family="'DejaVu Sans', Arial, Helvetica, sans-serif">
<title>Gradient magnitude per layer — mnist-012</title>
<rect width="328" height="242" fill="#ffffff"/>
<text x="12" y="20" font-size="13" text-anchor="start" font-weight="700" fill="#1b2430">Gradient magnitude per layer — mnist-012</text>
<g transform="translate(12,30)"><text x="56" y="26" font-size="9.5" text-anchor="end" fill="#1b2430">L1.W</text><rect x="62" y="14" width="27" height="17" fill="#6283ab"/><rect x="90" y="14" width="27" height="17" fill="#7895b8"/><rect x="118" y="14" width="27" height="17" fill="#85a0c0"/><text x="56" y="44" font-size="9.5" text-anchor="end" fill="#1b2430">L4.W</text><rect x="62" y="32" width="27" height="17" fill="#1e4c83"/><rect x="90" y="32" width="27" height="17" fill="#4f74a0"/><rect x="118" y="32" width="27" height="17" fill="#597ca6"/><rect x="166" y="104" width="12" height="9" fill="#eaf2fb"/><rect x="166" y="95" width="12" height="9" fill="#d4e0ee"/><rect x="166" y="86" width="12" height="9" fill="#bdcee1"/><rect x="166" y="77" width="12" height="9" fill="#a7bcd4"/><rect x="166" y="68" width="12" height="9" fill="#91aac7"/><rect x="166" y="59" width="12" height="9" fill="#7b98ba"/><rect x="166" y="50" width="12" height="9" fill="#6485ac"/><rect x="166" y="41" width="12" height="9" fill="#4e739f"/><rect x="166" y="32" width="12" height="9" fill="#386192"/><rect x="166" y="23" width="12" height="9" fill="#214f85"/><rect x="166" y="14" width="12" height="9" fill="#0b3d78"/><text x="182" y="22" font-size="9" text-anchor="start" fill="#1b2430">10⁰</text><text x="182" y="113" font-size="9" text-anchor="start" fill="#1b2430">10⁻²</text><text x="62" y="64" font-size="9.5" text-anchor="start" fill="#5b6573">Epoch 1 → 3</text></g>
<text x="12" y="168" font-size="10.5" text-anchor="start" fill="#1b2430">Mean L2 norm of each weight tensor’s batch</text>
<text x="12" y="182" font-size="10.5" text-anchor="start" fill="#1b2430">gradient over the epoch, on a logarithmic</text>
<text x="12" y="196" font-size="10.5" text-anchor="start" fill="#1b2430">scale (darker = larger). A pale top row with</text>
<text x="12" y="210" font-size="10.5" text-anchor="start" fill="#1b2430">a dark bottom row is the signature of</text>
<text x="12" y="224" font-size="10.5" text-anchor="start" fill="#1b2430">vanishing gradients.</text>
</svg>
